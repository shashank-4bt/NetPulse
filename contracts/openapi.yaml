openapi: 3.0.3
info:
  title: NetPulse API
  version: 0.13.0
  description: Versioned JSON contract for diagnoses, services, incidents, map aggregates, the user platform, the developer workspace, organizations, and the internal admin platform. No invented health. Auth tokens are session ids or hashed API keys, never localStorage. Client-supplied X-Forwarded-For is ignored unless NETPULSE_TRUST_PROXY is enabled on a proxy that overwrites it. Webhook URLs are HTTPS-only and revalidated on redirect.
servers:
  - url: http://localhost:8080
paths:
  /v1/health:
    get:
      summary: Process health
      responses:
        "200":
          description: API process is up
  /v1/diagnoses:
    post:
      summary: Create a diagnosis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
      responses:
        "201":
          description: Queued
        "400":
          description: Validation error
        "403":
          description: SSRF blocked
        "429":
          description: Rate limited
  /v1/diagnoses/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Diagnosis
        "404":
          description: Not found
  /v1/services:
    get:
      responses:
        "200":
          description: Editorial catalog, not live health
  /v1/services/{slug}:
    get:
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalog entry
        "404":
          description: Not found
  /v1/incidents:
    get:
      summary: Stored incidents only
      parameters:
        - in: query
          name: service
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: network
          schema: { type: string }
        - in: query
          name: severity
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: time
          schema: { type: string, enum: [all, 24h, 7d, 30d] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: pageSize
          schema: { type: integer }
      responses:
        "200":
          description: Stored incidents only. Empty means none recorded.
  /v1/incidents/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored incident
        "404":
          description: Not found
  /v1/map/aggregates:
    get:
      summary: Coarse geographic aggregates
      description: >
        Returns clustered, viewport-capped cells derived from stored incidents.
        Never includes raw measurements or precise individual locations.
        Coordinates, when present, are snapped to 1 degree.
      parameters:
        - in: query
          name: level
          schema: { type: string, enum: [world, country, region, network, service] }
        - in: query
          name: parent
          schema: { type: string }
        - in: query
          name: west
          schema: { type: number }
        - in: query
          name: south
          schema: { type: number }
        - in: query
          name: east
          schema: { type: number }
        - in: query
          name: north
          schema: { type: number }
        - in: query
          name: layers
          schema: { type: string }
          description: Comma-separated global,regional,network,service,incidents
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: service
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, maximum: 250 }
      responses:
        "200":
          description: Aggregated cells only. Empty means none stored.
        "503":
          description: Store unavailable
  /v1/auth/register:
    post:
      summary: Create an account
      responses:
        "201":
          description: Account created. sessionToken is for the BFF cookie only.
        "409":
          description: Email already registered
  /v1/auth/login:
    post:
      summary: Sign in
      responses:
        "200":
          description: Session established
        "401":
          description: Generic email or password failure
  /v1/auth/logout:
    post:
      summary: Revoke the current session
  /v1/auth/me:
    get:
      summary: Current user
  /v1/auth/verify-email:
    post:
      summary: Consume an email verification token
  /v1/auth/resend-verification:
    post:
      summary: Create another verification token. Email is not sent.
  /v1/auth/forgot-password:
    post:
      summary: Request a reset. Does not reveal whether the email exists.
  /v1/auth/reset-password:
    post:
      summary: Set a new password and revoke sessions
  /v1/auth/change-password:
    post:
      summary: Change password while signed in
  /v1/auth/sessions:
    get:
      summary: Active sessions for the current user
  /v1/auth/sessions/{id}/revoke:
    post:
      summary: Revoke one of the current user's sessions
      responses:
        "404":
          description: Unknown or foreign session
  /v1/auth/sessions/revoke-others:
    post:
      summary: Revoke every session except the current one
  /v1/auth/events:
    get:
      summary: Security events for the current user
  /v1/auth/methods:
    get:
      summary: Configured auth methods. OAuth, passkeys, and MFA stay empty.
  /v1/auth/oauth/{provider}:
    post:
      responses:
        "501":
          description: Provider not configured
  /v1/auth/passkeys:
    post:
      responses:
        "501":
          description: Passkeys are not configured
  /v1/auth/mfa:
    post:
      responses:
        "501":
          description: MFA is not configured
  /v1/me/profile:
    get:
      summary: Current profile
    patch:
      summary: Update display name
  /v1/me/privacy:
    get:
      summary: Privacy explanation and telemetry opt-in
    put:
      summary: Update telemetry opt-in
  /v1/me/deletion:
    post:
      summary: Delete the current account and owned data
  /v1/me/dashboard:
    get:
      summary: Honest dashboard snapshot. No invented health score.
  /v1/me/diagnoses:
    get:
      summary: Current user's diagnoses only
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: target
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
  /v1/me/reports:
    get:
      summary: Current user's reports
  /v1/me/reports/{id}/share:
    post:
      summary: Create a share token for an owned report
      responses:
        "404":
          description: Unknown or foreign report
  /v1/me/reports/{id}:
    delete:
      summary: Delete an owned report
      responses:
        "404":
          description: Unknown or foreign report
  /v1/me/saved-services:
    get:
      summary: Saved catalog slugs
    put:
      summary: Save a catalog slug
  /v1/me/saved-services/{slug}:
    delete:
      summary: Remove a saved slug
  /v1/me/devices:
    get:
      summary: Session devices, not a hardware inventory
  /v1/me/alerts:
    get:
      summary: Alert preferences. deliveredCount is stored, not invented.
    put:
      summary: Update alert preferences
  /v1/me/billing:
    get:
      summary: Billing is empty until an organization exists
  /v1/users/{id}/billing:
    get:
      summary: Owner-only billing. Foreign ids return 404.
  /v1/organizations/{id}:
    get:
      summary: Member-only organization. Foreign or unknown ids return 404.
  /v1/shares/{token}:
    get:
      summary: Read a report through a share token
  /v1/dev/workspace:
    get:
      summary: Current user's personal developer workspace
  /v1/dev/workspaces/{id}:
    get:
      summary: Owner-only workspace. Foreign ids return 404.
  /v1/dev/dashboard:
    get:
      summary: Stored-check dashboard. Empty series stay unmeasured.
  /v1/dev/monitors:
    get:
      summary: List tenant monitors
    post:
      summary: Create an HTTP, DNS, or TLS monitor
  /v1/dev/monitors/{id}:
    get:
      summary: Owner-only monitor. Foreign ids return 404.
    patch:
      summary: Update an owned monitor
    delete:
      summary: Delete an owned monitor
  /v1/dev/monitors/{id}/run:
    post:
      summary: Run a worker vantage check and store the actual result
  /v1/dev/incidents:
    get:
      summary: Tenant monitor incidents from stored checks
  /v1/dev/incidents/{id}:
    get:
      responses:
        "404":
          description: Unknown or foreign incident
  /v1/dev/keys:
    get:
      summary: List keys. Raw secrets are never included.
    post:
      summary: Create a key. Raw secret is returned once. Session only.
  /v1/dev/keys/{id}/rotate:
    post:
      summary: Rotate an owned key. Session only.
  /v1/dev/keys/{id}/revoke:
    post:
      summary: Revoke an owned key. Session only.
  /v1/dev/webhooks:
    get:
      summary: List webhooks. Signing secrets are never included.
    post:
      summary: Create an HTTPS webhook. Local and private URLs are rejected.
  /v1/dev/webhooks/{id}/rotate:
    post:
      summary: Rotate the signing secret
  /v1/dev/webhooks/{id}:
    delete:
      summary: Delete an owned webhook
  /v1/dev/webhooks/{id}/deliveries:
    get:
      summary: Stored deliveries with event id, timestamp, signature, retry, and idempotency
  /v1/dev/webhooks/{id}/retry:
    post:
      summary: Retry deliveries that are still retryable
  /v1/dev/alerts:
    get:
      summary: Alert rules. deliveredCount is stored, not invented.
    post:
      summary: Create an availability, latency, error, or incident rule
  /v1/dev/alerts/{id}:
    put:
      summary: Update an owned alert rule
    delete:
      summary: Delete an owned alert rule
  /v1/dev/usage:
    get:
      summary: Stored request, measurement, monitor, region, and webhook counts
  /v1/dev/sla:
    get:
      summary: Stored-check SLA ratios. Percentiles require at least five latency samples.
  /v1/orgs:
    get:
      summary: Organizations the signed-in user belongs to
    post:
      summary: Create an organization. Creator becomes owner.
  /v1/orgs/{orgId}:
    get:
      summary: Member-only organization. Foreign ids return 404.
    patch:
      summary: Rename an organization. Requires team.manage.
  /v1/orgs/{orgId}/dashboard:
    get:
      summary: Stored-check org dashboard. Empty series stay unmeasured.
  /v1/orgs/{orgId}/analytics:
    get:
      summary: Filter stored checks by region, network, ASN, service, endpoint, or device
  /v1/orgs/{orgId}/members:
    get:
      summary: List members of the organization
    post:
      summary: Invite by email. Requires team.manage. Unknown emails store an invite without confirming the account exists.
  /v1/orgs/{orgId}/members/{id}:
    patch:
      summary: Change a member role. Last owner cannot be demoted.
    delete:
      summary: Remove a member. Last owner cannot be removed. Foreign ids return 404.
  /v1/orgs/{orgId}/invites:
    get:
      summary: Pending invites. Requires team.manage.
  /v1/orgs/{orgId}/teams:
    get:
      summary: List teams
    post:
      summary: Create a team. Requires team.manage.
  /v1/orgs/{orgId}/teams/{id}:
    patch:
      summary: Update a team
    delete:
      summary: Delete a team
  /v1/orgs/{orgId}/devices:
    get:
      summary: Stored organization devices
    post:
      summary: Store a device label. This is not host discovery.
  /v1/orgs/{orgId}/devices/{id}:
    delete:
      summary: Delete an owned device. Foreign ids return 404.
  /v1/orgs/{orgId}/networks:
    get:
      summary: Stored organization networks
    post:
      summary: Store a network or ASN record
  /v1/orgs/{orgId}/networks/{id}:
    delete:
      summary: Delete an owned network
  /v1/orgs/{orgId}/services:
    get:
      summary: Stored organization services
    post:
      summary: Store a service endpoint for this organization
  /v1/orgs/{orgId}/services/{id}:
    delete:
      summary: Delete an owned organization service
  /v1/orgs/{orgId}/monitors:
    get:
      summary: Organization monitors. Separate from /v1/dev monitors.
    post:
      summary: Create an HTTP, DNS, or TLS organization monitor
  /v1/orgs/{orgId}/monitors/{id}:
    get:
      summary: Member-only monitor. Foreign ids return 404.
    delete:
      summary: Delete an organization monitor. Requires monitor.delete.
  /v1/orgs/{orgId}/incidents:
    get:
      summary: Organization incidents from stored checks
  /v1/orgs/{orgId}/incidents/{id}:
    get:
      responses:
        "404":
          description: Unknown or foreign incident
    patch:
      summary: Update incident status. Requires incident.manage.
  /v1/orgs/{orgId}/reports:
    get:
      summary: Stored organization reports
    post:
      summary: Generate availability, latency, incidents, regions, network, or findings from stored records
  /v1/orgs/{orgId}/reports/{id}:
    get:
      responses:
        "404":
          description: Unknown or foreign report
  /v1/orgs/{orgId}/diagnoses:
    get:
      summary: Organization-linked diagnoses. Requires diagnosis.read.
    post:
      summary: Create a diagnosis in the organization. Requires diagnosis.create.
  /v1/orgs/{orgId}/keys:
    get:
      summary: List organization keys. Raw secrets are never included.
    post:
      summary: Create an npo_ key. Raw secret is returned once. Session only.
  /v1/orgs/{orgId}/keys/{id}/rotate:
    post:
      summary: Rotate an organization key. Session only.
  /v1/orgs/{orgId}/keys/{id}/revoke:
    post:
      summary: Revoke an organization key. Session only.
  /v1/orgs/{orgId}/billing:
    get:
      summary: Empty until a billing account exists. Requires billing.manage. Foreign orgs return 404.
  /v1/orgs/{orgId}/audit:
    get:
      summary: Stored audit events. Requires audit.read.
  /v1/admin/me:
    get:
      summary: Operator identity. Signed-in non-operators receive 404.
      responses:
        "200":
          description: Operator
        "401":
          description: Unauthenticated
        "404":
          description: Not found
  /v1/admin/system:
    get:
      summary: Process, worker heartbeat, queue depth, backend names, and stored measurement figures. Empty series stay unmeasured.
  /v1/admin/users:
    get:
      summary: Account records without password hashes or session secrets.
  /v1/admin/users/{id}:
    get:
      summary: One account record.
  /v1/admin/organizations:
    get:
      summary: Stored organizations.
  /v1/admin/organizations/{id}:
    get:
      summary: One stored organization.
  /v1/admin/services:
    get:
      summary: Editorial catalog.
  /v1/admin/incidents:
    get:
      summary: Stored public incidents plus operator notes and overrides.
  /v1/admin/incidents/{id}:
    get:
      summary: One stored incident with notes.
  /v1/admin/incidents/{id}/annotate:
    post:
      summary: Store an operator note. Audited.
  /v1/admin/incidents/{id}/investigate:
    post:
      summary: Mark investigating and store a note. Audited.
  /v1/admin/incidents/{id}/escalate:
    post:
      summary: Raise stored severity. Audited.
  /v1/admin/incidents/{id}/resolve:
    post:
      summary: Resolve when recovery evidence exists, or with an audited override.
  /v1/admin/incidents/{id}/override:
    post:
      summary: Override automated classification. Always audited.
  /v1/admin/measurements:
    get:
      summary: Stored worker measurements.
  /v1/admin/diagnostics:
    get:
      summary: Stored diagnoses. Share tokens are not included.
  /v1/admin/rules:
    get:
      summary: Rule catalog, versions, thresholds, and labeled false positives/negatives.
  /v1/admin/rules/labels:
    post:
      summary: Store a false-positive or false-negative label for a diagnosis.
  /v1/admin/abuse:
    get:
      summary: Stored rate-limit, SSRF, and API abuse events.
  /v1/admin/audit:
    get:
      summary: Operator audit log with actor, action, resource, timestamp, and result.
  /v1/admin/flags:
    get:
      summary: Stored feature flags. Rollout counts are not estimated.
    post:
      summary: Create a flag with environment, percentage, user, and organization targeting.
  /v1/admin/flags/{id}:
    get:
      summary: Read a flag. Query environment, userId, and orgId to evaluate targeting.
    patch:
      summary: Update a stored flag.
  /v1/admin/config:
    get:
      summary: Remote configuration for timeouts, thresholds, limits, and feature settings.
    put:
      summary: Update a known configuration key. Secrets are rejected.
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            [validation_error, unauthorized, forbidden, not_found, rate_limited, unavailable, ssrf_blocked, internal]
        message:
          type: string
    DiagnosisStatus:
      type: string
      enum:
        [queued, running, complete, partial, failed, unavailable, insufficient_evidence]
